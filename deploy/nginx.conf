# /etc/nginx/sites-available/chjewellery
# This deployment is reached by bare IP (143.110.248.9), not a domain, so
# there is no Let's Encrypt certificate here — see deploy/README.md for how
# to add HTTPS once a domain is pointed at the server.

server {
    listen 80;
    listen [::]:80;
    server_name 143.110.248.9;

    client_max_body_size 150m; # matches proxyClientMaxBodySize in next.config.ts

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
