services:
  - type: web
    name: chjewellery
    runtime: node
    region: singapore
    plan: free
    # `npm ci` demands the lockfile match package.json exactly; Render's build
    # image resolves a couple of optional platform-specific transitive deps
    # (lightningcss's @emnapi/* WASM fallback) slightly differently than the
    # lockfile was generated locally, which `npm ci` treats as fatal. `npm
    # install` reconciles that instead of failing — the same pattern already
    # used by the other Node service in this workspace.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm run db:bootstrap-admin && npm run start -- --hostname 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chjewellery-db
          property: connectionString
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: SESSION_MAX_HOURS
        value: "12"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: CH Jewels Administrator

databases:
  - name: chjewellery-db
    databaseName: chjewellery
    user: chjewellery
    plan: free
    region: singapore
    postgresMajorVersion: "16"
