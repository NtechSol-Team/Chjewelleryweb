services:
  - type: web
    name: ch-jewels
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run db:bootstrap-admin && npm run start -- --hostname 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ch-jewels-db
          property: connectionString
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: SESSION_MAX_HOURS
        value: "12"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: CH Jewels Administrator

databases:
  - name: ch-jewels-db
    databaseName: ch_jewels
    user: ch_jewels
    plan: free
    region: singapore
    postgresMajorVersion: "18"
